name: AutoVideoGen
options:
  bundleIdPrefix: com.autovideogen
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AutoVideoGen:
    type: application
    platform: iOS
    sources:
      - path: AutoVideoGen
      - path: AutoVideoGenShared
    resources:
      - path: AutoVideoGen/Resources
    info:
      path: AutoVideoGen/Info.plist
      properties:
        CFBundleDisplayName: Auto Video Gen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        MobileAPIBaseURL: "$(MOBILE_API_BASE_URL)"
        MobileAPIAuthToken: "$(MOBILE_API_AUTH_TOKEN)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Connect to the local Auto Video Gen render backend while testing on a physical device."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autovideogen.mobile
        MOBILE_API_BASE_URL: "http://127.0.0.1:4319"
        MOBILE_API_AUTH_TOKEN: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: AutoVideoGenLiveActivity
        embed: true

  AutoVideoGenLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoVideoGenLiveActivity
      - path: AutoVideoGenShared
    info:
      path: AutoVideoGenLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Auto Video Gen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autovideogen.mobile.liveactivity
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
